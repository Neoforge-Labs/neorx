name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --group dev

      # ---------------------------------------------------------------
      # HARD GATE: ruff over paths this branch owns and has verified
      # clean, mirroring the `quality` job's hard gate below (see the
      # rationale there). Same whitelist, kept in sync by hand -- do not
      # let this list and the `quality` job's list drift apart.
      #
      # `ruff format --check .` and `ruff check .` over the whole tree
      # currently report 106 files needing reformatting and 402 lint
      # errors -- pre-existing debt from before the package-skeleton
      # restructure. A whole-tree `ruff format` sweep is deliberately
      # deferred: it would touch 106 files and obscure review of this
      # branch, so it belongs in its own dedicated change, not here.
      - name: Ruff (hard gate -- verified-clean paths)
        run: |
          uv run ruff check \
            src/neorx/genmol/__init__.py \
            src/neorx/dockbot/__init__.py \
            src/neorx/causalbiorl/__init__.py \
            src/neorx/cli/__init__.py \
            src/neorx/molscreen/__main__.py \
            src/neorx/experiments/__init__.py \
            src/neorx/experiments/record.py \
            src/neorx/experiments/registry.py \
            src/neorx/experiments/capture.py \
            src/neorx/experiments/chembl.py \
            src/neorx/experiments/gates.py \
            src/neorx/experiments/__main__.py \
            experiments/genmol_eval.py \
            experiments/causalbiorl_bench.py \
            experiments/neorx_7disease.py \
            experiments/figures.py \
            tests/causalbiorl/test_env_generation.py \
            tests/test_cli.py \
            tests/test_public_api.py
      - name: Ruff format (hard gate -- verified-clean paths)
        run: |
          uv run ruff format --check \
            src/neorx/genmol/__init__.py \
            src/neorx/dockbot/__init__.py \
            src/neorx/causalbiorl/__init__.py \
            src/neorx/cli/__init__.py \
            src/neorx/molscreen/__main__.py \
            src/neorx/experiments/__init__.py \
            src/neorx/experiments/record.py \
            src/neorx/experiments/registry.py \
            src/neorx/experiments/capture.py \
            src/neorx/experiments/chembl.py \
            src/neorx/experiments/gates.py \
            src/neorx/experiments/__main__.py \
            experiments/genmol_eval.py \
            experiments/causalbiorl_bench.py \
            experiments/neorx_7disease.py \
            experiments/figures.py \
            tests/causalbiorl/test_env_generation.py \
            tests/test_cli.py \
            tests/test_public_api.py

      # ADVISORY: whole-tree ruff, non-blocking. Kept visible in job
      # output (not deleted, not silenced) rather than swept under a
      # step that never runs -- same rationale as the `quality` job's
      # whole-tree advisory step.
      - name: Ruff format check (advisory -- whole tree, pre-existing debt)
        run: uv run ruff format --check . || true
      - name: Ruff lint (advisory -- whole tree, pre-existing debt)
        run: uv run ruff check . || true

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Both floors of requires-python must stay green -- this is the
        # matrix that guards the dependency-floor corrections directly:
        # a floor that only works on 3.13 would go undetected without it.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --group dev
      # -m "not network": these matrix cells otherwise hit httpbin.org, so a
      # third-party outage would turn the provenance gates red for reasons
      # that have nothing to do with this branch. Network tests stay
      # runnable locally -- just not gating CI.
      - name: Run tests
        run: uv run python -m pytest -q --tb=short --timeout=120 -m "not network"
      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          uv run python -m pytest \
            --cov=src/neorx \
            --cov-report=xml \
            --cov-report=term-missing \
            -q --tb=short --timeout=120 -m "not network"
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  quality:
    name: Lint, types, coverage, floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # check_floors.sh shells out to `uv pip install`.
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # dev tooling lives in [dependency-groups].dev (PEP 735), not a
      # `[project.optional-dependencies]` extra -- ".[dev]" is not a valid
      # extra on this project and would fail. Install the group itself
      # rather than hand-listing its members: a hand-written list silently
      # drifts the moment a dev dependency is added, which is exactly how
      # vcrpy went missing here and broke collection of 8 test modules
      # while the test matrix (which runs `uv sync --group dev`) stayed
      # green. --system because this job deliberately has no venv, so
      # check_floors.sh can drive `uv pip install` against the runner
      # interpreter.
      - run: uv pip install --system -e . --group dev

      # ---------------------------------------------------------------
      # HARD GATE: ruff + mypy over paths this branch owns and has
      # verified clean.
      #
      # `ruff check src/ tests/` and `mypy src/neorx` over the *whole*
      # tree currently report 354 / 336 errors. Those are pre-existing
      # findings inherited from before the package-skeleton restructure
      # (this is the src-layout migration branch, not a lint/type
      # cleanup) -- fixing all of it here is out of scope and is
      # scheduled as its own later sub-project. Leaving the whole-tree
      # check as a hard gate would just fail CI the instant it runs,
      # which is exactly the "gate that is red the moment it runs"
      # problem this restructure exists to end.
      #
      # So the hard gate below is scoped to the specific paths verified
      # ruff- and mypy-clean during the 2026-09-03 final-fix wave. It is
      # a ratchet, not a ceiling: as pre-existing debt in a file gets
      # cleared, add that file to this list -- never remove a file from
      # it to make room for new debt, and never widen the gate back out
      # to `src/ tests/` while known-dirty files remain in it.
      - name: Ruff (hard gate -- verified-clean paths)
        run: |
          ruff check \
            src/neorx/genmol/__init__.py \
            src/neorx/dockbot/__init__.py \
            src/neorx/causalbiorl/__init__.py \
            src/neorx/cli/__init__.py \
            src/neorx/molscreen/__main__.py \
            src/neorx/experiments/__init__.py \
            src/neorx/experiments/record.py \
            src/neorx/experiments/registry.py \
            src/neorx/experiments/capture.py \
            src/neorx/experiments/chembl.py \
            src/neorx/experiments/gates.py \
            src/neorx/experiments/__main__.py \
            experiments/genmol_eval.py \
            experiments/causalbiorl_bench.py \
            experiments/neorx_7disease.py \
            experiments/figures.py \
            tests/causalbiorl/test_env_generation.py \
            tests/test_cli.py \
            tests/test_public_api.py
      - name: Mypy (hard gate -- verified-clean paths)
        run: |
          mypy --follow-imports=silent \
            src/neorx/genmol/__init__.py \
            src/neorx/dockbot/__init__.py \
            src/neorx/causalbiorl/__init__.py \
            src/neorx/cli/__init__.py \
            src/neorx/molscreen/__main__.py \
            src/neorx/experiments/__init__.py \
            src/neorx/experiments/record.py \
            src/neorx/experiments/registry.py \
            src/neorx/experiments/capture.py \
            src/neorx/experiments/chembl.py \
            src/neorx/experiments/gates.py \
            src/neorx/experiments/__main__.py \
            experiments/genmol_eval.py \
            experiments/causalbiorl_bench.py \
            experiments/neorx_7disease.py \
            experiments/figures.py \
            tests/causalbiorl/test_env_generation.py \
            tests/test_cli.py \
            tests/test_public_api.py

      # ADVISORY: whole-tree ruff/mypy, non-blocking. This is the one
      # place the inherited 354/336 findings are checked in CI -- kept
      # visible in job output (not deleted, not silenced) rather than
      # swept under a step that never runs. This replaces the old
      # standalone `typecheck` job's `mypy ... || true`, which duplicated
      # this same whole-tree check under a different install path; two
      # contradictory mypy invocations in one workflow is its own kind
      # of theatre.
      - name: Ruff (advisory -- whole tree, pre-existing debt)
        run: ruff check src/ tests/ || true
      - name: Mypy (advisory -- whole tree, pre-existing debt)
        run: mypy src/neorx --ignore-missing-imports --no-error-summary || true

      - name: Coverage ratchet
        run: |
          # Baseline is the coverage of the first green build; it may rise,
          # never fall. Raising the target is sub-project 4's job.
          # -m "not network": see the same flag on the test job -- a
          # third-party outage must not turn this gate red either.
          pytest --cov=src/neorx --cov-report=term --cov-fail-under=$(cat .coverage-floor) -m "not network"
      - run: ./scripts/check_floors.sh

      - name: Experiment provenance gates
        run: |
          pytest tests/test_experiment_gates.py -q
