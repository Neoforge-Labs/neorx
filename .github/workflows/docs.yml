name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Pages deployment needs these; the build job alone would not.
permissions:
  contents: read
  pages: write
  id-token: write

# A queued deploy should supersede an older one, not race it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # mkdocstrings imports the package to read its docstrings, so the
      # package itself has to be installed -- not just the docs tools.
      # That means torch, rdkit and the rest: this job is not cheap, and
      # there is no shortcut, because an API page built without the
      # import would be headings with no prose under them.
      - name: Install the package and the docs group
        run: uv pip install --system -e . --group docs

      # --strict turns a broken internal link or a page missing from the
      # nav into a failed build. A docs site that silently loses a page is
      # worse than one that fails to publish.
      - name: Build
        run: mkdocs build --strict

      # The published examples are executable. If the API drifts from what
      # the docs claim, this fails here rather than misleading a reader.
      #
      # docs/ only: the rest of the suite is the CI workflow's job, and
      # docs/superpowers is excluded because those are archived plans, not
      # documentation (the --ignore comes from pyproject's addopts).
      - name: Check the documented examples still run
        run: |
          uv pip install --system --group dev
          python -m pytest docs/ -q --timeout=300

      # Named for what it actually checks. Under Pages'
      # build_type=workflow -- which is what this workflow uses -- a CNAME
      # file in the artifact does NOT configure the custom domain. It is
      # served as an ordinary static file while the Pages API still
      # reports cname=null. So this step confirms mkdocs carried
      # docs/CNAME into site/, and nothing more; calling it "confirm the
      # custom domain" would be a green check for something it never
      # looked at.
      #
      # The domain itself is set once, by hand, against the repository's
      # Pages REST endpoint:
      #
      #     gh api -X PUT "$ENDPOINT" -f cname=neorx.neoforgelabs.tech
      #
      # where $ENDPOINT is the Pages endpoint for this repository. Run it
      # only after neorx.neoforgelabs.tech resolves -- setting it earlier
      # breaks the working github.io URL by redirecting it to a host that
      # does not answer. (Spelled this way because tests/test_workflows.py
      # reads slash-separated tokens here as repository paths, correctly:
      # the literal endpoint would look like a file that does not exist.)
      #
      - name: Confirm mkdocs carried docs/CNAME into the artifact
        run: |
          test -f site/CNAME || { echo "FAIL: CNAME missing from site/"; exit 1; }
          echo "site/CNAME: $(cat site/CNAME)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    # Never publish from a pull request: it would let a fork overwrite the
    # live site.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
